name: Run tests

on:
    push:
        branches:
            - main
            - develop
            - feat/**
            - fix/**
    pull_request:
        branches:
            - main
            - develop

jobs:
    test-api:
        name: Run backend tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Install uv
              uses: astral-sh/setup-uv@v3
              with:
                  version: "latest"

            - name: Install dependencies
              run: cd api && uv sync --dev

            - name: Run tests
              run: cd api && uv run pytest --cov --cov-fail-under=75

            - name: Import Codecov GPG key
              run: |
                  gpg --keyserver keyserver.ubuntu.com --recv-keys 806BB28AED779869

            - name: Upload coverage reports
              uses: codecov/codecov-action@v5
              with:
                  files: ./api/.coverage
                  flags: api
                  fail_ci_if_error: true
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
