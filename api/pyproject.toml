[project]
name = "folio-api"
version = "1.22.3"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "alembic>=1.18.4",
    "apscheduler>=3.11.2",
    "asyncpg>=0.31.0",
    "email-validator>=2.0.0",
    "fastapi>=0.136.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.13.3",
    "aiohttp>=3.12.15",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.26",
    "sqlalchemy>=2.0.49",
    "tiingo>=0.16.1",
    "uvicorn>=0.45.0",
    "yfinance>=1.3.0",
    "valkey>=6.1.1",
]

[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = "--cov=adapters.inbound.http --cov=domain.entities.models --cov=domain.value_objects.money --cov=domain.services.performance --cov=application.auth.use_cases --cov=infrastructure.security.jwt --cov=infrastructure.config.env --cov-report=term-missing --cov-fail-under=75"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "happy_path: expected success cases",
    "grumpy_path: error handling and invalid input",
    "edge_case: boundary conditions and empty inputs",
    "integration: tests that require Docker Compose and Postgres",
    "smoke: fast readiness checks",
]
