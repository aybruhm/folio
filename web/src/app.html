<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <script>
            (() => {
                const stored = localStorage.getItem("theme");
                const prefersDark = window.matchMedia(
                    "(prefers-color-scheme: dark)",
                ).matches;
                const useDark = stored
                    ? stored === "dark"
                    : prefersDark || true;
                if (useDark) {
                    document.documentElement.classList.add("dark");
                } else {
                    document.documentElement.classList.remove("dark");
                }
            })();
        </script>
        <link
            rel="icon"
            type="image/png"
            href="%sveltekit.assets%/icon-192.png"
        />
        <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0B0E16" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta
            name="mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="Folio" />
        <link
            rel="apple-touch-icon"
            href="%sveltekit.assets%/apple-touch-icon.png"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        %sveltekit.head%
    </head>
    <body
        data-sveltekit-preload-data="hover"
        class="bg-background text-foreground"
    >
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
