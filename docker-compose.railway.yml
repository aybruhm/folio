services:
    db:
        image: postgres:16-alpine
        container_name: folio-railway-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${DB_USER:-folio}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-folio_dev_password}
            POSTGRES_DB: ${DB_NAME:-folio}
            PGDATA: /var/lib/postgresql/data/pgdata
        ports:
            - "${DB_PORT:-5433}:5432"
        volumes:
            - postgres_railway_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-folio}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - folio-railway-network

    api:
        build:
            context: .
            dockerfile: api/Dockerfile.railway
        image: folio-api-railway:latest
        container_name: folio-railway-api
        restart: unless-stopped
        env_file: ./api/.env.prod
        ports:
            - "${API_PORT:-8001}:8000"
        depends_on:
            db:
                condition: service_healthy
        command: >
            sh -c "python -m alembic upgrade head &&
                   python -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2"
        networks:
            - folio-railway-network
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; r=urllib.request.urlopen('http://localhost:8000/health', timeout=5); exit(0 if r.status==200 else 1)",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    web:
        build:
            context: .
            dockerfile: web/docker/Dockerfile.railway
        image: folio-web-railway:latest
        container_name: folio-railway-web
        command: node build/index.js
        restart: unless-stopped
        env_file: ./web/.env.local
        ports:
            - "${WEB_PORT:-3001}:3000"
        depends_on:
            api:
                condition: service_healthy
        networks:
            - folio-railway-network

volumes:
    postgres_railway_data:
        driver: local

networks:
    folio-railway-network:
        name: folio-railway-network
        driver: bridge
