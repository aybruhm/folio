services:
    api:
        image: ghcr.io/aybruhm/folio-api:latest
        container_name: folio-ghcr-api
        restart: unless-stopped
        env_file: ./api/.env.prod
        environment:
            DATABASE_URL: ${DATABASE_URL}
        ports:
            - "${API_PORT:-8000}:8000"
        depends_on:
            db:
                condition: service_healthy
        command: >
            python -m alembic upgrade head &&
            python -m uvicorn main:app
            --host 0.0.0.0
            --port ${API_PORT:-8000}
            --workers 2
        networks:
            - folio-prod-network
        healthcheck:
            test:
                [
                    "CMD",
                    "/opt/python/bin/python",
                    "-c",
                    "import urllib.request; r=urllib.request.urlopen('http://localhost:8000/health', timeout=5); exit(0 if r.status==200 else 1)",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    web:
        image: ghcr.io/aybruhm/folio-web:latest
        container_name: folio-ghcr-web
        restart: unless-stopped
        env_file: ./web/.env.local
        ports:
            - "${WEB_PORT:-3000}:3000"
        depends_on:
            api:
                condition: service_healthy
        command: node build/index.js
        networks:
            - folio-prod-network
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

networks:
    folio-prod-network:
        name: folio-prod-network
        driver: bridge
