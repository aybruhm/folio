services:
    db:
        image: postgres:16-alpine
        container_name: folio-prod-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${DB_USER:-folio}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-folio_dev_password}
            POSTGRES_DB: ${DB_NAME:-folio_prod}
            PGDATA: /var/lib/postgresql/data/pgdata
        ports:
            - "${DB_PORT:-5433}:5432"
        volumes:
            - postgres_prod_data:/var/lib/postgresql/data
            - ./infra/scripts/ensure-db-entrypoint.sh:/ensure-db-entrypoint.sh:ro
        entrypoint: ["/ensure-db-entrypoint.sh"]
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-folio}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - folio-prod-network

    api:
        image: ghcr.io/aybruhm/folio-api:latest
        container_name: folio-ghcr-api
        restart: unless-stopped
        env_file: ./api/.env.prod
        ports:
            - "${API_PORT:-8010}:8000"
        depends_on:
            db:
                condition: service_healthy
        command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
        networks:
            - folio-prod-network
        healthcheck:
            test:
                [
                    "CMD",
                    "/opt/python/bin/python",
                    "-c",
                    "import urllib.request; r=urllib.request.urlopen('http://localhost:8000/health', timeout=5); exit(0 if r.status==200 else 1)",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    web:
        image: ghcr.io/aybruhm/folio-web:latest
        container_name: folio-ghcr-web
        restart: unless-stopped
        env_file: ./web/.env.prod
        ports:
            - "${WEB_PORT:-3000}:3000"
        depends_on:
            api:
                condition: service_healthy
        command: node build/index.js
        networks:
            - folio-prod-network
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

networks:
    folio-prod-network:
        name: folio-prod-network
        driver: bridge

volumes:
    postgres_prod_data:
        driver: local
